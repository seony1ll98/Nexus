# ============================================================
# Nexus CI — 타입 검사 / 린트 / 빌드 / E2E
#
# 목적: "검사가 조용히 통과하는" 상태를 막는다.
#  - 백엔드 tsc, 프론트 eslint는 예전에 에러를 뱉는 채로 방치되어 있었다.
#  - E2E는 DB가 붙은 상태에서만 의미가 있으므로 postgres 서비스를 띄우고 실제로 돌린다.
# ============================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── 정적 검사 — 빠르게 실패시킨다 ──────────────────────────
  static:
    name: 타입 검사 · 린트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- 백엔드 ---
      - name: 백엔드 의존성 설치
        working-directory: backend
        run: npm ci

      - name: Prisma 클라이언트 생성
        working-directory: backend
        run: npx prisma generate

      - name: 백엔드 타입 검사
        working-directory: backend
        run: npx tsc --noEmit

      # --- 프론트엔드 ---
      - name: 프론트엔드 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 프론트엔드 린트
        working-directory: frontend
        run: npm run lint

      - name: 프론트엔드 타입 검사
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 프론트엔드 빌드
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  # ── E2E — 실제 DB + 서버를 띄우고 API를 호출한다 ───────────
  e2e:
    name: E2E (백엔드 API)
    runs-on: ubuntu-latest
    needs: static

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      NODE_ENV: development
      PORT: 8080
      FRONTEND_URL: http://localhost:3000
      ADMIN_SEED_PASSWORD: CiAdmin!2026
      TEST_EMAIL: admin@nexus.com
      TEST_PASSWORD: CiAdmin!2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 의존성 설치
        working-directory: backend
        run: npm ci

      - name: 마이그레이션 + 관리자 시드
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npx tsx src/seed.ts

      - name: 데이터 디렉토리 준비
        run: mkdir -p "$RUNNER_TEMP/projects" "$RUNNER_TEMP/projects-wt" "$RUNNER_TEMP/claude-configs"

      # [임시 조치 — F5]
      # 프로젝트 생성 시 서버가 `git commit`을 실행하는데, 러너에는 전역 gitconfig가 없어
      # "unable to auto-detect email address"로 실패한다(Docker 컨테이너도 동일).
      # 근본 해결은 애플리케이션이 커밋 신원을 직접 주입하는 것이며 3단계에서 처리한다.
      # 그때 이 스텝은 삭제해야 한다 — 남겨두면 같은 버그를 CI가 다시 못 잡는다.
      - name: git 커밋 신원 설정 (F5 해결 전까지의 임시 조치)
        run: |
          git config --global user.name "Nexus CI"
          git config --global user.email "ci@nexus.local"

      - name: 백엔드 기동
        working-directory: backend
        env:
          PROJECTS_DIR: ${{ runner.temp }}/projects
          PROJECTS_WT_DIR: ${{ runner.temp }}/projects-wt
          CLAUDE_CONFIGS_DIR: ${{ runner.temp }}/claude-configs
        run: |
          npx tsx src/index.ts > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/health

      - name: E2E 실행에 필요한 프로젝트 준비
        run: |
          curl -sf -c "$RUNNER_TEMP/cookies.txt" -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}" > /dev/null
          PROJECT=$(curl -sf -b "$RUNNER_TEMP/cookies.txt" -X POST http://localhost:8080/api/projects \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-project","description":"CI E2E 대상"}')
          PROJECT_ID=$(printf '%s' "$PROJECT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).id))")
          curl -sf -b "$RUNNER_TEMP/cookies.txt" -X POST http://localhost:8080/api/sessions \
            -H 'Content-Type: application/json' \
            -d "{\"projectId\":\"$PROJECT_ID\",\"title\":\"CI 기본 세션\"}" > /dev/null

      - name: 백엔드 E2E 테스트
        working-directory: backend
        run: npm test

      - name: 실패 시 백엔드 로그 출력
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"
